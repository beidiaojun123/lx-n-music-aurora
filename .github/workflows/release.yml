name: Build Android APK

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-22.04

    steps:
      # 1. 拉取源码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 配置 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3. 配置 Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 4. 缓存 React Native / Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. 安装 npm 依赖
      - name: Install dependencies
        run: npm ci

      # 6. 给 Gradle 执行权限
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 7. 构建 Release APK
      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # 8. 查找 APK
      - name: Find APK
        run: |
          echo "===== APK files ====="
          find android/app/build/outputs/apk -type f -name "*.apk" -print

      # 9. 重命名 APK
      - name: Rename APK
        run: |
          mkdir -p release

          APK=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found!"
            exit 1
          fi

          cp "$APK" "release/LX-N-Music-Aurora-${GITHUB_REF_NAME}.apk"

          echo "Built APK:"
          ls -lh release/

      # 10. 上传到 GitHub Actions Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LX-N-Music-Aurora-${{ github.ref_name }}
          path: release/*.apk
          if-no-files-found: error

      # 11. 创建 GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
